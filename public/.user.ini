; Allow plugin covers and gallery screenshots to upload on CGI/FPM servers.
; The local `php artisan serve` command reads php.ini instead, so the same
; values are set there for development.
upload_max_filesize = 16M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120

; PHP also needs a writable folder to park uploads while the request is handled.
; On most Linux hosts /tmp is used and works out of the box. If the server
; reports "could not be uploaded" for small files anyway, point PHP at a
; writable folder in php.ini, for example on Windows:
;   upload_tmp_dir = "C:/path/to/writable/temp"
;   sys_temp_dir   = "C:/path/to/writable/temp"
